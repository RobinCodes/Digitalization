<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Not found · Knowledge Index</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/Assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07070a; --bg2:#0d0d11; --bg3:#13131a;
      --border:rgba(255,255,255,.055); --border-md:rgba(255,255,255,.09);
      --text:#e0dbd0; --text2:#7e7a72; --text3:#3e3c38;
      --accent:#c4a13c; --accent2:#e8c96a;
      --font-display:'Cormorant Garamond',Georgia,serif;
      --font-ui:'Syne',sans-serif;
      --font-mono:'JetBrains Mono',monospace;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f5f0e8; --bg2:#ece6da; --bg3:#e2dbd0;
        --border:rgba(80,60,20,.12); --border-md:rgba(80,60,20,.20);
        --text:#1a160e; --text2:#6b6054; --text3:#a09585;
        --accent:#8a6818; --accent2:#b88c2a;
      }
    }
    html,body{height:100%}
    body{
      background:var(--bg); color:var(--text); font-family:var(--font-ui);
      display:flex; align-items:center; justify-content:center;
      padding:32px 22px; overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    /* The same slow radial wash the archive page opens with. */
    body::before{
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(1100px 620px at 18% -10%, rgba(196,161,60,.10), transparent 62%),
        radial-gradient(900px 520px at 92% 8%, rgba(160,123,196,.07), transparent 60%);
    }
    .wrap{position:relative; z-index:1; width:100%; max-width:660px; text-align:left}
    .crumb{
      font-family:var(--font-mono); font-size:10.5px; letter-spacing:.22em;
      text-transform:uppercase; color:var(--text3); margin-bottom:26px;
    }
    .code{
      font-family:var(--font-display); font-style:italic;
      font-size:clamp(76px,17vw,148px); line-height:.82;
      color:var(--accent); opacity:.26; letter-spacing:-.02em;
      user-select:none; margin-bottom:-6px;
    }
    h1{
      font-family:var(--font-display); font-weight:500;
      font-size:clamp(34px,7vw,60px); line-height:1.04;
      letter-spacing:-.015em; margin-bottom:20px;
    }
    h1 em{font-style:italic; color:var(--accent2)}
    p{
      color:var(--text2); font-size:15px; line-height:1.72; max-width:52ch;
      margin-bottom:14px;
    }
    p.sub{font-size:13.5px; color:var(--text3)}
    .path{
      display:inline-block; font-family:var(--font-mono); font-size:12px;
      color:var(--text2); background:var(--bg2); border:1px solid var(--border);
      border-radius:6px; padding:3px 8px; margin-top:2px;
      max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      vertical-align:bottom;
    }
    .rule{height:1px; background:var(--border); margin:30px 0 26px}
    .links{display:flex; flex-wrap:wrap; gap:10px}
    a.btn{
      display:inline-flex; align-items:center; gap:9px;
      font-family:var(--font-ui); font-size:13px; font-weight:500; letter-spacing:.01em;
      text-decoration:none; color:var(--text);
      background:var(--bg2); border:1px solid var(--border-md);
      border-radius:9px; padding:10px 16px;
      transition:border-color .2s, transform .2s cubic-bezier(.34,1.56,.64,1), background .2s;
    }
    a.btn:hover{border-color:var(--accent); transform:translateY(-2px); background:var(--bg3)}
    a.btn.primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-color:transparent; color:#14110a; font-weight:600;
    }
    a.btn.primary:hover{filter:brightness(1.06)}
    a.btn svg{width:15px; height:15px; flex:none}
    .foot{
      margin-top:34px; font-family:var(--font-mono); font-size:10.5px;
      letter-spacing:.16em; text-transform:uppercase; color:var(--text3);
    }
    @media (max-width:520px){
      body{padding:26px 18px; align-items:flex-start; padding-top:15vh}
      .links{flex-direction:column; align-items:stretch}
      a.btn{justify-content:center}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="crumb">/ 404</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page isn't <em>in the index</em>.</h1>
    <p>
      Nothing lives at that address. It may have been renamed, it may never have existed,
      or it may be a note you need to be signed in to reach.
    </p>
    <p class="sub"><span class="path" id="reqPath">—</span></p>

    <div class="rule"></div>

    <div class="links">
      <a class="btn primary" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to the archive
      </a>
      <a class="btn" href="/#page=days">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        What happened
      </a>
      <a class="btn" href="/#page=articles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Articles
      </a>
    </div>

    <div class="foot">Knowledge Index · Digitalization</div>
  </main>

  <script nonce="__CSP_NONCE__">
    // Show the address that missed — read from location, never from the server, so
    // nothing the URL contains can be injected as markup.
    document.getElementById('reqPath').textContent = location.pathname + location.search;
  </script>
</body>
</html>
