      position: fixed; z-index: 99998;

    body.c-hover #cur-dot  { width: 4px; height: 4px; background: #e8c96a; }

    body.c-click #cur-dot  { width: 9px; height: 9px; }
    body.c-click #cur-ring { width: 20px; height: 20px; }
    .cur-ripple {
      position: fixed; z-index: 99997; pointer-events: none; border-radius: 50%;

      animation: cRipple .6s ease forwards;
    }
    @keyframes cRipple {
      from { transform: translate(-50%,-50%) scale(0); opacity:1; width:10px; height:10px; }
      to   { transform: translate(-50%,-50%) scale(1); opacity:0; width:80px; height:80px; }
    }

  <script>
  (() => {
    const dot  = document.getElementById('cur-dot');
    const ring = document.getElementById('cur-ring');
    let mx=-200,my=-200,rx=-200,ry=-200;
    const LERP=0.13, lerp=(a,b,t)=>a+(b-a)*t;
    const b = document.body;

    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
    document.addEventListener('mousedown', e => {
      b.classList.add('c-click');
      const r=document.createElement('div'); r.className='cur-ripple';
      r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
      document.body.appendChild(r);
      r.addEventListener('animationend',()=>r.remove());
    });
    document.addEventListener('mouseup',    () => b.classList.remove('c-click'));
    document.addEventListener('mouseleave', () => { dot.style.opacity='0'; ring.style.opacity='0'; });
    document.addEventListener('mouseenter', () => { dot.style.opacity='1'; ring.style.opacity='1'; });

    const HS = 'a,button,.back-btn,[data-hover]';
    document.addEventListener('mouseover', e => { if(e.target.closest(HS)) b.classList.add('c-hover'); });
    document.addEventListener('mouseout',  e => { if(e.target.closest(HS)) b.classList.remove('c-hover'); });

    (function anim() {
      dot.style.left =mx+'px'; dot.style.top =my+'px';
      rx=lerp(rx,mx,LERP);    ry=lerp(ry,my,LERP);
      ring.style.left=rx+'px'; ring.style.top=ry+'px';
      ring.style.transition='none';
      requestAnimationFrame(anim);
    })();
  })();
  </script>
